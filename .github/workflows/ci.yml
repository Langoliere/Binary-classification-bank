name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Проверка компиляции
        run: python -m compileall src tests

      - name: Запуск тестов
        run: pytest tests -v --tb=short

      - name: Smoke-обучение на сэмпле
        run: |
          head -5000 data/data.csv > /tmp/sample.csv
          python -m src.train --data /tmp/sample.csv --n-trials 2 --sample 3000 --no-register

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t bank-deposit-api .
